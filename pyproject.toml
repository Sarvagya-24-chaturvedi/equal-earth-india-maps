[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equal-earth-india"
version = "1.0.0"
description = "Sovereign-compliant, publication-ready Equal Earth cartography and thematic mapping toolkit for India and the world."
readme = "README.md"
authors = [{ name = "Sarvagya Chaturvedi" }]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "matplotlib>=3.8.0",
    "cartopy>=0.22.0",
    "shapely>=2.0.0",
    "numpy>=1.24.0",
    "pyproj>=3.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
equal-earth = "equal_earth.cli:main"

[tool.setuptools.packages.find]
include = ["equal_earth*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
